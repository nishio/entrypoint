<figure><img src="page-27.png" loading="lazy" alt="page 27"><figcaption><b>p27</b>アカデミアとビジネスの違い27アカデミア•データが公開されている•枯れた技術はとっくの昔に調査済み•新しい手法を考案して精度を競い合うビジネス•データが公開されてない枯れた技術を使う</figcaption></figure>
<figure><img src="page-28.png" loading="lazy" alt="page 28"><figcaption><b>p28</b>ビジネスの目的28顧客価値新規性ではない</figcaption></figure>
<figure><img src="page-29.png" loading="lazy" alt="page 29"><figcaption><b>p29</b>顧客価値を体感するための小問29ある宝石の原石は、割ると1/2の確率で宝石が入っていて2万円で売れる。原石は1つ9500円で買える。原石は硬いので1日に20個しか割れないQ1: 1日に稼げる収益の期待値はいくらか仕入れ原価原石1/2宝石9500円×1/2売上2万円0円</figcaption></figure>
<figure><img src="page-30.png" loading="lazy" alt="page 30"><figcaption><b>p30</b>A1収益の期待値30 A1: 1/2の確率で20000円手に入るので、1個あたりの収入の期待値は10000円。1個あたりの仕入れ価格は9500なので、1個あたりの収益は500円。1日に20個処理できるので、1日あたりの収益は10000円。原価9500円売上1万円1つあたり500円の利益</figcaption></figure>
<figure><img src="page-31.png" loading="lazy" alt="page 31"><figcaption><b>p31</b>Q2加工速度二倍の装置31 Q2:原石を人間の2倍の速度で割る機械を手に入れたとする。つまり、1日に割ることができる原石の数が20個から40個に増えたとする。収益の期待値はいくら増えるか?</figcaption></figure>
<figure><img src="page-32.png" loading="lazy" alt="page 32"><figcaption><b>p32</b>A2加工速度二倍の装置32 A2:原石1個あたり500円の利益なのは変わらない。1日に処理できる量が20個から40個に増える。20個増えるので、利益は1万円増える。原価9500円売上1万円1つあたり500円の利益</figcaption></figure>
<figure><img src="page-33.png" loading="lazy" alt="page 33"><figcaption><b>p33</b>Q3 60%の識別器33 Q3: 60%の確率で宝石の入った原石を当てる識別器*が買えるとする。収益の期待値はいくら増えるか?仕入れ原価原石60%宝石9500円×40%売上2万円0円*原石を買う前に使うことで「60%の確率で宝石が入っている原石」を9500円で手に入れられるようになるとします。お店の人が嫌がりそう、という点は今回は気にません。またQ2の機械は手に入っておらず、1日に割れる数は20個のままとします。</figcaption></figure>
<figure><img src="page-34.png" loading="lazy" alt="page 34"><figcaption><b>p34</b>A3: 60%の識別器34 60%の確率で20000円手に入るので、1個あたりの収入の期待値は12000円。1個あたりの仕入れ価格は9500円なので、1個あたりの収益は2500円。1日に20個処理できるので1日あたりの収益は5万円。4万円増える。原価9500円売上12000円1つあたり2500円の利益</figcaption></figure>
<figure><img src="page-35.png" loading="lazy" alt="page 35"><figcaption><b>p35</b>つまり35この問題設定では、「加工速度を2倍にする装置」は顧客の利益を1万円増やし、「精度60%の識別器」は顧客の利益を4万円増やす。</figcaption></figure>
<figure><img src="page-36.png" loading="lazy" alt="page 36"><figcaption><b>p36</b>教訓36この問題設定では、「精度60%の識別器」が「加工速度を2倍にする装置」の4倍の顧客価値を持っている。どの程度の精度でどの程度の顧客価値を生み出すことができるかはビジネス要件によって決まる。精度は必ずしも重要ではない</figcaption></figure>
<figure><img src="page-37.png" loading="lazy" alt="page 37"><figcaption><b>p37</b>ビジネス要件37精度を高めようと考える前に、まず顧客が何を求めているか、どういう制約条件があるのかを明確化する必要がある。最新の論文に書かれた手法を実装しても、その手法が要求する量のデータを顧客が用意できないのであれば、その実装は顧客価値を持たない。</figcaption></figure>
<figure><img src="page-38.png" loading="lazy" alt="page 38"><figcaption><b>p38</b>顧客は専門家ではない38多くの場合顧客は機械学習の専門家ではないので必要な精度も、満たすべき制約条件も、明確に言語化することができない。なので、これを高速に学び取ることが必要。</figcaption></figure>
<figure><img src="page-39.png" loading="lazy" alt="page 39"><figcaption><b>p39</b>Minimum Viable Product 39 ITベンチャー経営の方法論「リーン・スタートアップ」で提唱された考え方。ベンチャーは資金に限りがあるので素早く顧客ニーズを理解しなければならない。そこで、最小限のコストで雑な製品を作り、それを実際に顧客に見せてみることで、顧客のニーズがどこにあるのかを探る。</figcaption></figure>
<figure><img src="page-40.png" loading="lazy" alt="page 40"><figcaption><b>p40</b>最小限の実装=実装しない40「コンシェルジュ型MVP」と呼ばれる</figcaption></figure>
